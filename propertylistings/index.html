<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property buy list</title>
<style>
:root{--ink:#1d2321;--ink2:#5b6561;--line:#e2e5e3;--bg:#f7f6f2;--card:#fff;--teal:#4f8a7b;--amber:#b26a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px;line-height:1.25}h2{font-size:18px;margin:26px 0 8px}
.fact{color:var(--ink2);font-size:14px}.intro{margin:6px 0 16px}
.pick{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0}
.pick label{font-weight:600;font-size:14px}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:44px;max-width:100%}
.count{color:var(--ink2);font-size:14px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.type{display:block;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:inherit}
.type b{display:block;font-size:28px}.type span{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.card.pend{border-color:rgba(255,180,0,.6);background:#fffbf2}
.t{font-weight:600;font-size:16px}.pr{font-weight:700;font-size:20px;margin-top:2px}.psf{color:var(--ink2);font-weight:600}
.st{color:var(--amber);font-size:14px;margin:4px 0}.card div{font-size:14px}
button{font:inherit;font-size:14px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;margin:8px 8px 0 0}
button[aria-pressed=true]{border-color:var(--teal);background:rgba(79,138,123,.14);font-weight:600}
.det{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
a{color:#2a6f5f;word-break:break-word}details{margin:14px 0}summary{cursor:pointer;font-weight:600}
.note{background:#fff3df;border:1px solid #f0d9a8;border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0}
.back{font-size:14px}
.exc{font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}
</style></head><body><main id="app">Loading…</main>

const price=p=>{const m=String(p).match(/S\$\s*([0-9,]+)/);return m?+m[1].replace(/,/g,''):Infinity};
const TYPES=[['industrial','Industrial','Industrial'],['offices','Office','Offices'],['retail','Retail','Retail & F&B'],['shophouses','Shophouse','Shophouses'],['hdb-shophouses','HDBShophouse','HDB shophouses'],['coffeeshops','Coffee','Coffeeshops']];
const AUD={Industrial:'industrialAudit',Office:'officeAudit',Retail:'retailAudit',Shophouse:'shophouseAudit',HDBShophouse:'hdbAudit'};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function entries(key){
  if(key==='Coffee'){const a=D.coffeeAudit;return [...a.items.map(x=>({x,pending:false})),...a.pending.map(x=>({x,pending:true}))]}
  const g=D.groups.find(g=>g.key===key),a=D[AUD[key]];
  return [...g.items.map(x=>({x,pending:false})),...a.pending.map(x=>({x,pending:true}))];
}
function bandsFor(key){
  if(key==='HDBShophouse')return [['S$1m or below',0,1e6],['Above S$1m to S$2m',1e6,2e6],['Above S$2m to S$3m',2e6,3e6],['Above S$3m to S$4m',3e6,4e6],['Above S$4m to S$5m',4e6,5e6]];
  if(key==='Coffee')return [['All prices, cheapest first',-1,Infinity]];
  return [['S$1m or below',0,1e6]];
}
function nav(cur){return `<div class="pick"><label for="pt">Property type</label><select id="pt" onchange="location.hash=this.value"><option value="">All property types</option>${TYPES.map(t=>`<option value="${t[0]}"${t[0]===cur?' selected':''}>${t[2]}</option>`).join('')}</select></div>`}
function card(e,sk){
  const x=e.x,id=x.l||x.n,saved=store.get(sk).includes(id);
  const issue=x.missing||x.f||'';
  return `<div class="card${e.pending?' pend':''}"><div class="t">${esc(x.n)}</div><div class="pr">${esc(x.p)}</div><div class="psf">${esc(x.psf)} psf</div>
  ${e.pending?`<div class="st">${esc(x.status||'Needs agent confirmation')}${issue?' - '+esc(issue):''}</div>`:`<div class="st" style="color:var(--ink2)">Ad-supported; check title before buying</div>`}
  <div>Years left: ${esc(/freehold/i.test(x.tn)?'Freehold':x.tn)}</div><div>Level: ${esc(x.floorSizes||x.level||'Not stated')}</div><div>Size: ${esc(x.s)}</div>${x.lastRead?`<div>Last read: ${esc(x.lastRead)}</div>`:''}
  <button type="button" aria-pressed="${saved}" data-sk="${esc(sk)}" data-id="${esc(id)}" onclick="tog(this)">${saved?'Remove from shortlist':'Save for second look'}</button>
  <button type="button" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden;this.textContent=this.nextElementSibling.hidden?'More details':'Hide details'">More details</button>
  <div class="det" hidden><div>District: ${esc(x.d)}</div><div>Agent: ${esc(x.a)}</div>${x.f?`<div>Notes: ${esc(x.f)}</div>`:''}${x.availabilityNote?`<div>${esc(x.availabilityNote)}</div>`:''}${x.l?`<div><a href="${esc(x.l)}" target="_blank" rel="noopener">Open the ad</a></div>`:''}</div></div>`;
}
function tog(b){const k=b.dataset.sk,id=b.dataset.id;let a=store.get(k);a=a.includes(id)?a.filter(v=>v!==id):[...a,id];store.set(k,a);render()}
function home(){
  const c=k=>k==='Coffee'?D.coffeeAudit.items.length:D.groups.find(g=>g.key===k).items.length;
  return `<h1>Property buy list</h1><div class="fact">${D.total} ad-supported units · checked from market listings</div><p class="intro">Browse by property type, then by asking price.</p>${nav('')}
  <div class="types">${TYPES.map(t=>`<a class="type" href="#${t[0]}"><b>${c(t[1])}</b><span>${t[2]}</span></a>`).join('')}</div>
  <h2>The rules applied</h2><p>Asking prices as advertised, stamp duty not counted. Tenure is the remaining lease: office, retail, shophouse and HDB shophouse 45 years or above (exactly 45 qualifies); industrial 40 years or above. Units with an unknown lease are kept and flagged to call the agent. Coffeeshops: whole properties only, no price cap.</p>
  <div class="note">Asking prices are not all-in costs. Confirm title, tenure and availability with the agent before relying on any listing.</div>`;
}
function typePage(slug){
  const t=TYPES.find(t=>t[0]===slug);if(!t)return home();
  const key=t[1],sk=key+'-shortlist.v1',all=entries(key),bands=bandsFor(key);
  let sel=+(sessionStorage.getItem('band-'+slug)||0);const saved=store.get(sk);
  const opts=bands.map((b,i)=>`<option value="${i}"${i===sel?' selected':''}>${b[0]}</option>`).join('')+`<option value="s"${sel==='s'?' selected':''}>Shortlist</option>`;
  const isS=sessionStorage.getItem('band-'+slug)==='s';
  let shown;
  if(isS)shown=all.filter(e=>saved.includes(e.x.l||e.x.n));
  else{const b=bands[sel]||bands[0];shown=all.filter(e=>{const p=price(e.x.p);return p>b[1]&&p<=b[2]});}
  shown=[...shown].sort((a,b)=>price(a.x.p)-price(b.x.p));
  const ok=shown.filter(e=>!e.pending).length;
  let out=`<a class="back" href="#">&larr; All property types</a><h1>${t[2]} by asking price</h1><div class="fact">${all.filter(e=>!e.pending).length} ad-supported · ${all.filter(e=>e.pending).length} need a check</div>${nav(slug)}
  <div class="pick"><label for="band">Show</label><select id="band" onchange="sessionStorage.setItem('band-${slug}',this.value);render()">${bands.map((b,i)=>`<option value="${i}"${!isS&&i===sel?' selected':''}>${b[0]}</option>`).join('')}<option value="s"${isS?' selected':''}>Shortlist</option></select><span class="count">${isS?shown.length+' saved':ok+' ad-supported, '+(shown.length-ok)+' need check'}</span></div>`;
  out+=shown.length?shown.map(e=>card(e,sk)).join(''):`<p>${isS?'Nothing saved yet.':'No listings in this price band.'}</p>`;
  out+=`<div class="note">Listings marked "needs check" are kept visible, with what is missing; call the agent to confirm before relying on them.</div>`;
  if(key!=='Coffee'){const a=D[AUD[key]];out+=`<details><summary>About this list</summary><p>${esc(a.scope||'')}</p></details>`;
    if(a.excluded&&a.excluded.length)out+=`<details><summary>Removed after ad check (${a.excluded.length})</summary>${a.excluded.map(x=>`<div class="exc"><b>${esc(x.n)}</b>: ${esc(x.why)} ${x.l?`<a href="${esc(x.l)}" target="_blank" rel="noopener">ad</a>`:''}</div>`).join('')}</details>`}
  else{const a=D.coffeeAudit;out+=`<details><summary>About this list</summary><p>${esc(a.scope||'')}</p></details>`;if(a.excluded.length)out+=`<details><summary>Removed after ad check (${a.excluded.length})</summary>${a.excluded.map(x=>`<div class="exc"><b>${esc(x.n)}</b>: ${esc(x.why)} ${x.l?`<a href="${esc(x.l)}" target="_blank" rel="noopener">ad</a>`:''}</div>`).join('')}</details>`}
  return out;
}
function render(){const h=location.hash.slice(1);$('#app').innerHTML=h?typePage(h):home()}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
(async()=>{try{const bin=Uint8Array.from(atob(document.getElementById('d').textContent.trim()),c=>c.charCodeAt(0));const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(st).text());render()}catch(e){$('#app').textContent='Could not load the list.'}})();
</script></body></html>
