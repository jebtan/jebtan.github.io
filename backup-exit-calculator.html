<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Exit Calculator</title><style>:root{--ds-page:#fff;--ds-ink:#1d1d1f;--ds-ink-2:#5f6368;--ds-hairline:#d9d9d9;--ds-raised:#f3f3f3;--ds-teal:#0b6b63;--ds-red:#b00020}
*{box-sizing:border-box}body{font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ds-ink);-webkit-text-size-adjust:100%}
.card{max-width:1100px;margin:0 auto;padding:20px 24px 40px}@media(min-width:768px){.card{padding:28px 36px 48px}}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 10px}.fact{color:var(--ds-ink-2);margin:0 0 6px}
.btn{font:inherit;min-height:44px;padding:0 14px;border:1px solid var(--ds-hairline);background:#fff;border-radius:6px;cursor:pointer;color:var(--ds-ink)}.btn.primary{background:var(--ds-ink);color:#fff}.btn.ghost{background:none}
.rowx{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ds-hairline)}.rows{border-top:1px solid var(--ds-hairline)}.num{width:24px;color:var(--ds-ink-2)}.nm{flex:1;display:flex;flex-direction:column}.nm small{color:var(--ds-ink-2)}
.choice{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.closing{margin-top:32px;color:var(--ds-ink-2);font-size:13px}.callout ul{margin:6px 0 0;padding-left:20px}
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.file-nav { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--ds-hairline); }
.file-nav a { padding: 10px 0; color: var(--ds-ink-2); text-decoration: none; }
.file-nav a[aria-current="page"] { color: var(--ds-ink); box-shadow: inset 0 -1px 0 var(--ds-ink); }
@media (max-width: 600px) { .file-nav a { display: inline-flex; align-items: center; min-height: 44px; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.unit-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
@media (min-width: 640px) { .unit-grid { grid-template-columns: 1fr 1fr 1fr; } }
.unit-grid label { display: flex; flex-direction: column; gap: 4px; color: var(--ds-ink-2); font-size: 13px; }
.unit-grid input, .field input { font: inherit; color: var(--ds-ink); background: #fff7df; border: 1px solid var(--ds-hairline); border-radius: 4px; padding: 0 10px; min-height: 44px; box-sizing: border-box; width: 100%; }
.facts { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--ds-hairline); }
.facts > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ds-hairline); }
.facts span { color: var(--ds-ink-2); }
.facts b { font-weight: 600; text-align: right; }
.facts b.big { font-size: 18px; color: var(--ds-teal); }
.scroll { overflow-x: auto; margin: 0 -24px; padding: 0 24px; -webkit-overflow-scrolling: touch; }
@media (min-width: 768px) { .scroll { margin: 0 -36px; padding: 0 36px; } }
table.calc { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 880px; }
table.calc th, table.calc td { border-bottom: 1px solid var(--ds-hairline); padding: 4px 8px; vertical-align: middle; }
table.calc thead th { position: sticky; top: 0; background: var(--ds-page); text-align: right; font-weight: 600; padding: 10px 8px; z-index: 2; }
table.calc tbody th[scope="row"] { position: sticky; left: 0; background: var(--ds-page); text-align: left; font-weight: 350; width: 210px; min-width: 150px; max-width: 210px; z-index: 1; padding-right: 12px; }
table.calc thead th:first-child { position: sticky; left: 0; z-index: 3; }
table.calc tr.head th { background: var(--ds-raised); text-align: left; font-weight: 600; padding: 10px 8px; position: static; }
td.cell-out { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 140px; }
td.cell-out.strong { font-weight: 600; }
td.cell-out.bad { color: var(--ds-red); font-weight: 600; }
td.cell-in { min-width: 140px; }
.field { position: relative; display: block; }
.field input { text-align: right; padding-left: 22px; padding-right: 22px; }
.field i { position: absolute; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ds-ink-2); pointer-events: none; }
.field i:first-child { left: 9px; }
.field i:last-child { right: 9px; }
.seg { display: flex; gap: 4px; justify-content: flex-end; }
.seg button { white-space: nowrap; font: inherit; min-height: 44px; padding: 0 10px; border: 1px solid var(--ds-hairline); background: #fff7df; color: var(--ds-ink); border-radius: 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ds-ink); color: #fff; border-color: var(--ds-ink); }
.notes { padding-left: 20px; display: grid; gap: 14px; }
@media (max-width: 600px) { table.calc tbody th[scope="row"] { width: 130px; min-width: 130px; font-size: 13px; line-height: 18px; } td.cell-out, td.cell-in { min-width: 150px; } .seg button { padding: 0 8px; font-size: 13px; } }

.sec { font: inherit; font-weight: 600; background: none; border: 0; padding: 0; min-height: 44px; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer; color: var(--ds-ink); }
.sec span { display: inline-flex; width: 20px; justify-content: center; color: var(--ds-ink-2); }
.viewbar { display: grid; gap: 4px; justify-items: start; margin-bottom: 8px; }

.neg-box { border: 2px solid #b00020; background: #fde7ea; color: #7a0014; border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.neg-box ul { margin: 6px 0 0; padding-left: 20px; }
.unit-grid input, .field input, td input { font-size: 16px; }

.list-field { display: flex; flex-direction: column; gap: 6px; }
.list-field select { font-size: 16px; font: inherit; font-size: 16px; color: var(--ds-ink); background: #fff7df; border: 1px solid var(--ds-hairline); border-radius: 4px; padding: 0 8px; min-height: 44px; width: 100%; box-sizing: border-box; }
.other-row { position: relative; display: block; }
.other-row input { width: 100%; }

.type-sel { font: inherit; font-size: 16px; color: inherit; background: #fff7df; border: 1px solid var(--ds-hairline); border-radius: 4px; min-height: 40px; max-width: 100%; box-sizing: border-box; }

.type-wrap { display: flex; flex-direction: column; gap: 4px; }
.type-wrap .type-sel { width: 100%; font-size: 16px; min-height: 40px; }

io where the shares do not add up to 100%."],["Deal completion %","Excel had it typed in each scenario. It must equal 100% minus LTV minus the 1% and 4% already paid, so it is now automatic (15% at 80% LTV, 5% at 90%). Same values as Excel. You can still type your own."],["Hard-coded numbers made into inputs","Rental commission (1 month of rent), agent commission (2%), GST rate (the Excel used 9%) and the 3-year exit (36 months in the loan balance and cash flow) were typed into formulas. They are now boxes. The GST rate starts at 0% as you asked, the sample deal uses 9% like the Excel, and the other boxes start at the Excel values."],["Property tax at exit","Excel had $12,000 typed in this row ($0 in Scenario Four). It is kept as a box you fill in, with an On/Off switch above it (On by default, which matches the Excel; Off leaves it out of the net capital gain). Property tax is also taken off every month in passive income, so check with your trainer what this extra row is meant to cover."],["Maximum buying price","Kept as Excel has it: Scenario One rent times 1200 divided by (180 divided by remaining years). This is the trainer's rule, not an official one. It uses Scenario One rent only. Freehold shows n/a."],["Stamp duty base","IRAS applies BSD to the higher of purchase price and market value. This calculator uses the purchase price, like the Excel, not the bank valuation."],["Exit period longer than the loan","With the exit period now a box, a period longer than the loan tenure would show a negative loan balance. The loan is treated as fully repaid at exit instead, and a warning is shown. Monthly instalments are still counted for the whole period."],["Typing numbers",'Boxes accept $, % and commas, so "$1,000,000" and "80%" work.'],["Branding and layout","Trainer branding removed. Same layout and same maths otherwise: four scenarios side by side, closing costs, loan, rent, exit profit and the backer split."]];return(0,h.jsx)(Da,{label:"Where this differs from the o
